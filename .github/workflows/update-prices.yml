name: update-prices
on:
  schedule:
    - cron: "0 2 * * *"  # 每天 02:00 UTC，低频，不高频爬
  workflow_dispatch: {}
permissions:
  contents: write
jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: {python-version: "3.12"}
      - name: Scrape homepage (prices only)
        run: python3 scripts/scrape.py
      - name: Commit if changed
        run: |
          git config user.name "oil-price-bot"
          git config user.email "bot@example.com"
          git add data/ public/data/
          git diff --cached --quiet || git commit -m "chore(data): update prices $(date -u +%F)"
          git push
