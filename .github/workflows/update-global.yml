name: update-global
on:
  schedule:
    - cron: "0 3 * * 1"  # 每周一 03:00 UTC，EU 与 FRED 均为周更，不要高频
  workflow_dispatch: {}
permissions:
  contents: write
jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: {python-version: "3.12"}
      - name: Install deps (openpyxl for EU xlsx)
        run: pip install openpyxl
      - name: Fetch global prices (EU + FRED + China avg)
        run: python3 scripts/fetch_global.py
      - name: Commit if changed
        run: |
          git config user.name "oil-price-bot"
          git config user.email "bot@example.com"
          git add data/global.json public/data/global.json data/meta.json public/data/meta.json
          git diff --cached --quiet || git commit -m "chore(data): update global $(date -u +%F)"
          git push
